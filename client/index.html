<!DOCTYPE html>
<html>

<head>
    <title>WAPDA Alert — LED Control</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
        }

        #status {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
        }

        .on {
            color: green;
        }

        .off {
            color: red;
        }

        .conn {
            color: blue;
        }
    </style>
</head>

<body>

    <h1>WAPDA Alert — LED Control</h1>

    <button onclick="sendOn()">ON</button>
    <button onclick="sendOff()">OFF</button>
    <br><br>
    <button onclick="sendReset()" style="background-color: #ff4444; color: white; border: none; border-radius: 5px;">RESET DEVICE (FACTORY)</button>

    <div id="status" class="conn">Connecting...</div>

    <script>
        const WS_URL = "ws://wapda-alert.local:81";

        let ws;

        function setStatus(text, cls) {
            const el = document.getElementById("status");
            el.innerText = text;
            el.className = cls;
        }

        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                setStatus("Connected to wapda-alert.local", "conn");
            };

            ws.onclose = () => {
                setStatus("Disconnected (reconnecting...)", "off");
                setTimeout(connect, 2000);
            };

            ws.onmessage = (event) => {
                if (event.data === "STATE:ON") {
                    setStatus("LED is ON", "on");
                }

                if (event.data === "STATE:OFF") {
                    setStatus("LED is OFF", "off");
                }
            };
        }

        function sendOn() {
            if (ws && ws.readyState === 1) ws.send("ON");
        }

        function sendOff() {
            if (ws && ws.readyState === 1) ws.send("OFF");
        }

        function sendReset() {
            if (confirm("Are you sure you want to factory reset the ESP8266? You will need to reconfigure its WiFi via the mobile app.")) {
                if (ws && ws.readyState === 1) ws.send("RESET");
            }
        }

        connect();
    </script>

</body>

</html>
