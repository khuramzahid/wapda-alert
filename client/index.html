<!DOCTYPE html>
<html>

<head>
    <title>WAPDA Alert — LED Control</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
        }

        #status {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
        }

        .on {
            color: green;
        }

        .off {
            color: red;
        }

        .conn {
            color: blue;
        }
    </style>
</head>

<body>

    <h1>WAPDA Alert — LED Control</h1>

    <button onclick="sendOn()">ON</button>
    <button onclick="sendOff()">OFF</button>
    <br><br>
    <button onclick="sendReset()" style="background-color: #ff4444; color: white; border: none; border-radius: 5px;">RESET DEVICE (FACTORY)</button>

    <div id="status" class="conn">Connecting...</div>

    <script>
        const WS_URL = "ws://wapda-alert.local:81";

        let ws;
        let lastLedStatus = null; // true/false when known, null when unknown

        function setStatus(text, cls) {
            const el = document.getElementById("status");
            el.innerText = text;
            el.className = cls;
        }

        function renderLedStatus() {
            if (lastLedStatus === true) setStatus("LED is ON", "on");
            else if (lastLedStatus === false) setStatus("LED is OFF", "off");
            else setStatus("Connected (state unknown)", "conn");
        }

        function sendJson(obj) {
            if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
        }

        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                setStatus("Connected to wapda-alert.local", "conn");
                // Ask for a fast round-trip; firmware replies with {"type":"pong",...}
                sendJson({ type: "ping", timestamp: Date.now() });
            };

            ws.onclose = () => {
                setStatus("Disconnected (reconnecting...)", "off");
                setTimeout(connect, 2000);
            };

            ws.onmessage = (event) => {
                // Firmware sends JSON messages like:
                // {"type":"initial_state","led_status":true,...}
                // {"type":"state_update","led_status":false,...}
                // {"type":"resetting"}
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    // Backward-compat: accept legacy plain-text
                    if (event.data === "STATE:ON") { lastLedStatus = true; renderLedStatus(); }
                    if (event.data === "STATE:OFF") { lastLedStatus = false; renderLedStatus(); }
                    return;
                }

                if (data && (data.type === "initial_state" || data.type === "state_update") && typeof data.led_status === "boolean") {
                    lastLedStatus = data.led_status;
                    renderLedStatus();
                    return;
                }

                if (data && data.type === "resetting") {
                    lastLedStatus = null;
                    setStatus("Device is resetting...", "conn");
                    return;
                }
            };
        }

        function sendOn() {
            // Firmware supports explicit ON/OFF (and we keep JSON as fallback).
            if (ws && ws.readyState === 1) ws.send("ON");
        }

        function sendOff() {
            if (ws && ws.readyState === 1) ws.send("OFF");
        }

        function sendReset() {
            if (confirm("Are you sure you want to factory reset the ESP8266? You will need to reconfigure its WiFi via the mobile app.")) {
                // Firmware accepts {"command":"reset"} OR plain "RESET"
                sendJson({ command: "reset" });
            }
        }

        connect();
    </script>

</body>

</html>
